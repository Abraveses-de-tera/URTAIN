<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle architectural grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="510" x2="1200" y2="510" />
  </g>

  <!-- Glow highlights -->
  <circle cx="200" cy="150" r="180" fill="#0284c7" opacity="0.15" filter="blur(60px)" />
  <circle cx="1050" cy="450" r="220" fill="#2563eb" opacity="0.12" filter="blur(70px)" />

  <!-- Top Badge -->
  <rect x="80" y="70" width="350" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="105" y="97" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">
    📍 BENAVENTE Y COMARCA · ZAMORA
  </text>

  <!-- Title URTAIN -->
  <text x="80" y="210" font-family="'Outfit', 'Inter', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="3">
    CARPINTERÍA URTAIN
  </text>
  <text x="80" y="270" font-family="'Outfit', 'Inter', sans-serif" font-size="36" font-weight="700" fill="url(#accentGrad)" letter-spacing="1.5">
    Aluminio con Rotura de Puente Térmico &amp; PVC
  </text>

  <!-- Description paragraph -->
  <text x="80" y="340" font-family="'Inter', sans-serif" font-size="22" fill="#94a3b8">
    Ventanas de alta eficiencia energética, cerramientos para porches y terrazas,
  </text>
  <text x="80" y="375" font-family="'Inter', sans-serif" font-size="22" fill="#94a3b8">
    puertas de seguridad, persianas térmicas y mosquiteras a medida.
  </text>

  <!-- Bottom cards -->
  <g transform="translate(80, 440)">
    <!-- Card 1 -->
    <rect width="320" height="110" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="44" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">⭐ 4.9/5 en Google</text>
    <text x="24" y="74" font-family="'Inter', sans-serif" font-size="15" fill="#94a3b8">Calidad y servicio garantizado</text>

    <!-- Card 2 -->
    <rect x="350" width="320" height="110" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="374" y="44" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#38bdf8">⚡ -45% en Calefacción</text>
    <text x="374" y="74" font-family="'Inter', sans-serif" font-size="15" fill="#94a3b8">Aislamiento acústico y térmico</text>

    <!-- Card 3 -->
    <rect x="700" width="340" height="110" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="724" y="44" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#22c55e">📞 619 49 36 59</text>
    <text x="724" y="74" font-family="'Inter', sans-serif" font-size="15" fill="#f8fafc">Presupuestos sin compromiso</text>
  </g>
</svg>